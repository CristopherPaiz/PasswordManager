name: CI

on:
  push:
    branches: [main]
  pull_request:

# Una corrida por rama: un push nuevo cancela la anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Los lockfiles de `api/` y `ui/` están versionados, así que CI instala con
# `--frozen-lockfile`: falla si el lockfile no cuadra con el package.json en vez
# de resolver versiones nuevas en silencio (un cambio de dependencia tiene que
# entrar por commit, no por corrida de CI).
jobs:
  api:
    name: API (lint · tipos · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Los tests corren contra SQLite en memoria con el esquema real de
      # init_tables.ts: no tocan Turso ni necesitan credenciales.
      - run: pnpm test

      - run: pnpm build

  ui:
    name: UI (lint · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # `build` corre `tsc -b` antes de Vite: cubre el typecheck del front.
      - run: pnpm build
