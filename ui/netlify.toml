# Base directory en Netlify = "ui" (este archivo se lee desde ahí).
# command + publish son relativos a esa base.

[build]
  # Compila la SPA. Genera ui/dist con index.html + assets hasheados.
  command = "pnpm build"
  # Publicar dist (NO la carpeta ui cruda; si no, sirve /src/main.tsx como
  # octet-stream y el navegador rechaza el módulo).
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fallback SPA: cualquier ruta no-archivo va a index.html (React Router).
# Netlify sirve primero los archivos reales de /assets, así que esto NO
# rompe el MIME de los .js.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cabeceras de seguridad. La CSP es la defensa principal contra XSS: si alguien
# inyecta JS, no puede robar la vaultKey de memoria si la política lo bloquea.
#
# Notas:
# - 'wasm-unsafe-eval' es OBLIGATORIO: Argon2id (hash-wasm) compila WebAssembly.
# - img-src data: lo necesita el QR del TOTP (data URL).
# - publickey-credentials-get/create (self) para que funcionen las passkeys.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://password.cpaiz.es; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    # Aísla la pestaña: sin COOP, una ventana abierta por (o que abrió a) la app
    # conserva una referencia y puede sondearla. CORP evita que otros sitios
    # incrusten sus recursos.
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), publickey-credentials-get=(self), publickey-credentials-create=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
